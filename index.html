<!doctype html>
<html lang="sr-Latn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>eBex — kupuj i prodaj uz BEX dostavu</title>
<meta name="description" content="eBex: besplatni oglasi, plaćanje pouzećem i dostava BEX kurirskom službom.">
<meta name="theme-color" content="#0E3B8C">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="eBex">
<style>
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --ink:#141820; --muted:#5B6372; --line:#DEE2E8;
  --brand:#0E3B8C; --brand-ink:#FFFFFF; --signal:#FFC928; --signal-ink:#141820;
  --ok:#17784A; --warn:#9A5B00; --danger:#B8322A; --soft:#EAF0FB; --hold:#FFF4D6;
  --r-sm:6px; --r:10px; --r-lg:16px;
  --font: ui-sans-serif, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0F1218; --surface:#171B23; --ink:#EBEEF3; --muted:#9AA3B3; --line:#2A303B;
    --brand:#86A8FF; --brand-ink:#0F1218; --soft:#1C2433; --hold:#3A3015; --ok:#4CC58A; --warn:#E3A93C; --danger:#F07A70; color-scheme:dark; }
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--font);-webkit-font-smoothing:antialiased}
a{color:var(--brand);text-decoration:none}
a:hover{text-decoration:underline}
img{max-width:100%;display:block}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--signal);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}
.sandbox{background:var(--hold);color:var(--ink);font-size:13px;text-align:center;padding:6px 12px;border-bottom:1px solid var(--line)}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--surface)}
.bar{display:flex;align-items:center;gap:12px;height:60px}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:22px;letter-spacing:-.02em;color:var(--ink)}
.logo:hover{text-decoration:none}
.logo i{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:8px;background:var(--brand);color:var(--brand-ink);font-style:normal;font-size:17px}
.bar form{flex:1;display:flex;max-width:520px}
.bar form input{flex:1;min-width:0;border:1px solid var(--line);border-right:0;border-radius:var(--r) 0 0 var(--r);padding:9px 12px;background:var(--bg)}
.bar form button{border:1px solid var(--brand);background:var(--brand);color:var(--brand-ink);border-radius:0 var(--r) var(--r) 0;padding:0 14px;cursor:pointer}
.navlinks{display:flex;gap:4px;margin-left:auto;align-items:center}
.navlinks a{color:var(--ink);padding:8px 10px;border-radius:var(--r-sm);position:relative}
.navlinks a:hover{background:var(--bg);text-decoration:none}
.dot{position:absolute;top:4px;right:2px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--danger);color:#fff;font-size:11px;line-height:17px;text-align:center}
.tabs{display:none}
main{min-height:70vh;padding:20px 0 96px}
h1{font-size:clamp(28px,4.4vw,44px);line-height:1.08;letter-spacing:-.025em;margin:0 0 12px;font-weight:800;max-width:18ch}
h2{font-size:20px;letter-spacing:-.01em;margin:28px 0 12px}
h3{font-size:16px;margin:0 0 8px}
p{margin:0 0 12px}
.muted{color:var(--muted)}
.small{font-size:14px}
.hero{padding:24px 0 8px}
.hero p{font-size:18px;color:var(--muted);max-width:56ch}
.bigsearch{display:flex;gap:8px;max-width:640px;margin-top:20px}
.bigsearch input{flex:1;min-width:0;padding:14px 16px;border:2px solid var(--ink);border-radius:var(--r);background:var(--surface);font-size:17px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;color:var(--ink);font-size:14px;cursor:pointer}
.chip:hover,.chip.on{border-color:var(--brand);color:var(--brand);text-decoration:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.card{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;color:var(--ink)}
.card:hover{text-decoration:none;border-color:var(--muted)}
.ph{aspect-ratio:4/3;background:var(--soft);display:grid;place-items:center;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover}
.ph svg{width:44px;opacity:.35}
.cb{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px}
.tag{align-self:flex-start;background:var(--signal);color:var(--signal-ink);font-weight:800;padding:2px 8px;border-radius:4px 10px 10px 4px;font-variant-numeric:tabular-nums;position:relative;padding-left:16px}
.tag::before{content:"";position:absolute;left:6px;top:50%;width:5px;height:5px;margin-top:-2.5px;border-radius:50%;background:var(--signal-ink);opacity:.55}
.ct{font-size:15px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cm{display:flex;gap:6px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.badge{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--brand);white-space:nowrap}
.badge.ok{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}
.badge.warn{background:var(--hold);color:var(--warn)}
.badge.bad{background:color-mix(in srgb,var(--danger) 14%,transparent);color:var(--danger)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 16px;border-radius:var(--r);cursor:pointer;font-weight:600;text-decoration:none}
.btn:hover{text-decoration:none;border-color:var(--muted)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.buy{background:var(--signal);border-color:var(--signal);color:var(--signal-ink);font-size:17px;padding:13px 20px}
.btn.danger{color:var(--danger)}
.btn.block{width:100%}
.btn:disabled{opacity:.55;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px}
.panel+.panel{margin-top:14px}
.two{display:grid;grid-template-columns:1.25fr 1fr;gap:24px;align-items:start}
.form{display:grid;gap:14px}
.field{display:grid;gap:5px}
.field label{font-weight:600;font-size:14px}
.field .hint{font-size:13px;color:var(--muted)}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=tel],select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface)}
textarea{min-height:110px;resize:vertical}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:15px}
.check input{margin-top:4px;width:18px;height:18px;flex:none}
.note{background:var(--soft);border-radius:var(--r);padding:12px 14px;font-size:14px}
.note.hold{background:var(--hold)}
.note.bad{background:color-mix(in srgb,var(--danger) 12%,transparent)}
.sum{display:grid;grid-template-columns:1fr auto;gap:6px 16px;font-variant-numeric:tabular-nums}
.sum .tot{font-weight:800;font-size:19px;border-top:1px solid var(--line);padding-top:8px;margin-top:4px}
.gallery .main{aspect-ratio:4/3;background:var(--soft);border-radius:var(--r-lg);overflow:hidden;display:grid;place-items:center}
.gallery .main img{width:100%;height:100%;object-fit:contain;background:#000}
.thumbs{display:flex;gap:8px;margin-top:8px;overflow-x:auto}
.thumbs button{border:2px solid transparent;padding:0;border-radius:var(--r-sm);overflow:hidden;width:72px;height:56px;flex:none;cursor:pointer;background:var(--soft)}
.thumbs button.on{border-color:var(--brand)}
.thumbs img{width:100%;height:100%;object-fit:cover}
.desc{white-space:pre-wrap;overflow-wrap:anywhere}
.list{display:grid;gap:10px}
.item{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;color:var(--ink)}
.item:hover{text-decoration:none;border-color:var(--muted)}
.item .ph{width:72px;height:56px;aspect-ratio:auto;border-radius:var(--r-sm);flex:none}
.item .grow{flex:1;min-width:0}
.item .ttl{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat{display:flex;flex-direction:column;height:calc(100vh - 230px);min-height:420px}
.msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg)}
.msg{max-width:78%;padding:8px 12px;border-radius:14px;background:var(--bg);align-self:flex-start;overflow-wrap:anywhere;white-space:pre-wrap}
.msg.me{align-self:flex-end;background:var(--brand);color:var(--brand-ink)}
.msg.sys{align-self:center;background:transparent;color:var(--muted);font-size:13px;text-align:center}
.msg.blocked{background:var(--hold);color:var(--ink);border:1px dashed var(--warn)}
.msg time{display:block;font-size:11px;opacity:.7;margin-top:2px}
.offer{align-self:center;width:min(360px,100%);border:2px solid var(--signal);border-radius:var(--r);padding:12px;background:var(--surface)}
.composer{display:flex;gap:8px;margin-top:10px}
.composer textarea{min-height:46px;height:46px}
.route{list-style:none;margin:0;padding:0}
.route li{position:relative;padding:0 0 18px 34px}
.route li::before{content:"";position:absolute;left:9px;top:22px;bottom:-2px;border-left:2px dashed var(--line)}
.route li:last-child::before{display:none}
.route li .pin{position:absolute;left:0;top:2px;width:20px;height:20px;border-radius:50%;border:2px solid var(--line);background:var(--surface)}
.route li.done .pin{background:var(--brand);border-color:var(--brand)}
.route li.done::before{border-left-style:solid;border-color:var(--brand)}
.route li.now .pin{border-color:var(--brand);box-shadow:0 0 0 4px var(--soft)}
.route li.hold .pin{background:var(--signal);border-color:var(--warn)}
.route li.bad .pin{background:var(--danger);border-color:var(--danger)}
.route b{display:block}
.trk{font-family:ui-monospace,Menlo,monospace;letter-spacing:.06em;font-size:15px;background:var(--bg);padding:3px 8px;border-radius:var(--r-sm)}
.steps{counter-reset:s;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:8px}
.steps div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;counter-increment:s}
.steps div::before{content:counter(s);display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--brand);color:var(--brand-ink);font-weight:700;margin-bottom:6px}
.uploads{display:flex;flex-wrap:wrap;gap:8px}
.uploads .u{position:relative;width:96px;height:72px;border-radius:var(--r-sm);overflow:hidden;background:var(--soft)}
.uploads .u img{width:100%;height:100%;object-fit:cover}
.uploads .u button{position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;cursor:pointer;line-height:24px;padding:0}
.uploads .u .cov{position:absolute;left:3px;bottom:3px;font-size:11px;background:var(--signal);color:var(--signal-ink);padding:0 5px;border-radius:3px}
.checklist{list-style:none;padding:0;margin:0;display:grid;gap:6px}
.checklist li{display:flex;gap:8px;align-items:baseline}
.checklist li::before{content:"○";color:var(--muted);font-weight:700}
.checklist li.ok::before{content:"✓";color:var(--ok)}
.empty{text-align:center;padding:40px 16px;color:var(--muted)}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;display:grid;gap:8px;width:min(480px,92vw)}
.toast{background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:var(--r);box-shadow:0 8px 24px rgba(0,0,0,.25)}
.toast.bad{background:var(--danger);color:#fff}
.toast.warn{background:var(--signal);color:var(--signal-ink)}
.spin{display:inline-block;width:18px;height:18px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spin{animation-duration:2s}}
.pager{display:flex;justify-content:center;margin-top:18px}
.filters{display:grid;gap:10px}
.split{display:grid;grid-template-columns:240px 1fr;gap:20px;align-items:start}
footer{border-top:1px solid var(--line);padding:24px 0 110px;color:var(--muted);font-size:14px}
footer .row{gap:16px}
@media (max-width: 820px){
  .two,.split{grid-template-columns:1fr}
  .bar form{display:none}
  .navlinks .hide-m{display:none}
  .tabs{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
  .tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 9px;font-size:11px;color:var(--muted);position:relative}
  .tabs a.on{color:var(--brand)}
  .tabs a:hover{text-decoration:none}
  .tabs svg{width:22px;height:22px}
  .tabs a.plus span{display:grid;place-items:center;width:38px;height:30px;border-radius:9px;background:var(--signal);color:var(--signal-ink);font-size:22px;font-weight:700;line-height:1}
  .grid{grid-template-columns:repeat(2,1fr);gap:10px}
  .chat{height:calc(100vh - 250px)}
}
</style>
</head>
<body>
<div id="sbx" class="sandbox" hidden>Test okruženje: BEX dostava, naplata i SMS su simulirani. Ne unosi stvarne podatke trećih lica.</div>
<header class="top">
  <div class="wrap bar">
    <a class="logo" href="#/"><i>e</i>eBex</a>
    <form id="topSearch" role="search"><input name="q" type="search" placeholder="Pretraži oglase" aria-label="Pretraga"><button aria-label="Traži">Traži</button></form>
    <nav class="navlinks" id="navlinks"></nav>
  </div>
</header>
<main id="app" class="wrap" tabindex="-1"></main>
<footer><div class="wrap row"><span>eBex · dostava i naplata pouzećem: BEX Express</span><a href="#/kako-radi">Kako radi</a><a href="#/uslovi">Uslovi korišćenja</a><a href="#/privatnost">Privatnost</a></div></footer>
<nav class="tabs" id="tabs" aria-label="Glavna navigacija"></nav>
<div id="toast" aria-live="polite"></div>

<script src="./config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
<script>
'use strict';
/* =================== osnova =================== */
const CONF = window.EBEX_CONFIG || {};
const CONFIGURED = /^https:\/\/.+\.supabase\.co\/?$/.test(CONF.SUPABASE_URL || '') && (CONF.SUPABASE_ANON_KEY || '').length > 20 && !/OVDE/.test(CONF.SUPABASE_ANON_KEY || '');
const SB_URL = (CONF.SUPABASE_URL || '').replace(/\/$/, '');
const sb = (CONFIGURED && window.supabase) ? window.supabase.createClient(SB_URL, CONF.SUPABASE_ANON_KEY) : null;
const app = document.getElementById('app');
const S = { session: null, me: null, cfg: {}, cats: [], channel: null, timer: null };

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const go = h => { if (location.hash === h) router(); else location.hash = h; };
const uid = () => S.session?.user?.id || null;

function money(para) {
  if (para === null || para === undefined || para === '') return '—';
  const v = Math.round(Number(para)); const neg = v < 0; const a = Math.abs(v);
  const int = Math.trunc(a / 100), dec = a % 100;
  let s = String(int).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  if (dec) s += ',' + String(dec).padStart(2, '0');
  return (neg ? '−' : '') + s + ' RSD';
}
const TZ = 'Europe/Belgrade';
function fmtDate(iso, time) {
  if (!iso) return '—';
  if (/^\d{4}-\d{2}-\d{2}$/.test(iso)) { const [y, m, d] = iso.split('-'); return `${d}.${m}.${y}.`; }
  const p = new Intl.DateTimeFormat('en-GB', { timeZone: TZ, day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false }).formatToParts(new Date(iso));
  const g = t => (p.find(x => x.type === t) || {}).value;
  return `${g('day')}.${g('month')}.${g('year')}.` + (time ? ` ${g('hour')}:${g('minute')}` : '');
}
const imgUrl = p => p ? `${SB_URL}/storage/v1/object/public/listing-media/${p.split('/').map(encodeURIComponent).join('/')}` : '';
const PARCEL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 7l9-4 9 4v10l-9 4-9-4z"/><path d="M3 7l9 4 9-4M12 11v10M7.5 5l9 4"/></svg>';

const L = {
  listing: { DRAFT: 'Nacrt', PENDING_REVIEW: 'Na pregledu', ACTIVE: 'Aktivan', RESERVED: 'Rezervisan', SOLD: 'Prodat', PAUSED: 'Pauziran', REJECTED: 'Vraćen na doradu', REMOVED: 'Uklonjen' },
  order: { AWAITING_SHIPMENT: 'Čeka predaju BEX-u', IN_TRANSIT: 'U transportu', DELIVERED: 'Uručeno', COMPLETED: 'Završeno', CANCELLED: 'Otkazano', SHIPMENT_EXPIRED: 'Isteklo — nije predato', COD_COLLECTION_FAILED: 'Kupac nije preuzeo', DISPUTED: 'Reklamacija u toku', RETURN_REQUIRED: 'Povrat robe', MANUAL_REVIEW: 'Ručni pregled' },
  cod: { PENDING: 'Čeka naplatu', COLLECTED: 'Naplaćeno', FAILED: 'Nije naplaćeno', CANCELLED: 'Otkazano' },
  payout: { NOT_DUE: 'Još nije dospela', REMITTANCE_PENDING: 'Čeka BEX isplatu', PAYOUT_HOLD: 'Zadržana', PAID: 'Isplaćeno', PAYOUT_FAILED: 'Neuspela' },
  cond: { NOVO: 'Novo', KAO_NOVO: 'Kao novo', POLOVNO: 'Polovno', ZA_DELOVE: 'Za delove' },
  mode: { BUY: 'Kupi odmah', CONTACT: 'Kontaktiraj me' },
  acc: { PENDING: 'Čeka proveru', REVIEW: 'Ručna provera', VERIFIED: 'Verifikovan', REJECTED: 'Odbijen' },
  idn: { NONE: 'Nije započeta', PENDING: 'Čeka proveru', VERIFIED: 'Verifikovan', REJECTED: 'Odbijena' },
  ship: { CREATED: 'Prijavljena BEX-u', PICKED_UP: 'BEX preuzeo', IN_TRANSIT: 'U transportu', OUT_FOR_DELIVERY: 'Kurir dostavlja', DELIVERED: 'Uručeno', RETURNING: 'Vraća se pošiljaocu', RETURNED: 'Vraćeno', CANCELLED: 'Otkazano' }
};
const tone = s => ({ ACTIVE: 'ok', COMPLETED: 'ok', PAID: 'ok', VERIFIED: 'ok', COLLECTED: 'ok', DELIVERED: 'ok', PENDING_REVIEW: 'warn', PAYOUT_HOLD: 'warn', DISPUTED: 'warn', REVIEW: 'warn', PENDING: 'warn', REMITTANCE_PENDING: 'warn', REJECTED: 'bad', REMOVED: 'bad', CANCELLED: 'bad', SHIPMENT_EXPIRED: 'bad', FAILED: 'bad', PAYOUT_FAILED: 'bad', COD_COLLECTION_FAILED: 'bad', SUSPENDED: 'bad' }[s] || '');
const badge = (map, s) => `<span class="badge ${tone(s)}">${esc((L[map] || {})[s] || s)}</span>`;

function toast(msg, kind = '') {
  const t = document.createElement('div'); t.className = 'toast ' + kind; t.textContent = msg;
  $('#toast').appendChild(t); setTimeout(() => t.remove(), kind === 'bad' ? 7000 : 4500);
}
function errMsg(e) {
  const m = (e && (e.message || e.error_description || e.msg)) || String(e);
  if (/Invalid login credentials/i.test(m)) return 'Pogrešna e-adresa ili lozinka.';
  if (/User already registered/i.test(m)) return 'Nalog sa ovom e-adresom već postoji. Prijavi se.';
  if (/Password should be at least/i.test(m)) return 'Lozinka mora imati najmanje 8 znakova.';
  if (/Email not confirmed/i.test(m)) return 'E-adresa nije potvrđena. Otvori poruku koju smo poslali.';
  if (/Failed to fetch|NetworkError/i.test(m)) return 'Nema veze sa serverom. Proveri internet i pokušaj ponovo.';
  if (/JWT|apikey|Invalid API key/i.test(m)) return 'Aplikacija nije ispravno povezana sa bazom (proveri config.js).';
  return m;
}
async function rpc(name, args) {
  const { data, error } = await sb.rpc(name, args || {});
  if (error) throw new Error(errMsg(error));
  if (data && typeof data === 'object' && data.ok === false) throw new Error(data.error || 'Radnja nije uspela.');
  return data;
}
async function q(promise) { const { data, error } = await promise; if (error) throw new Error(errMsg(error)); return data; }
async function busy(btn, fn) {
  const old = btn.innerHTML; btn.disabled = true; btn.innerHTML = '<span class="spin"></span>';
  try { return await fn(); } catch (e) { toast(errMsg(e), 'bad'); } finally { if (btn.isConnected) { btn.disabled = false; btn.innerHTML = old; } }
}

const cardHtml = l => `<a class="card" href="#/oglas/${esc(l.id)}">
  <div class="ph">${l.cover ? `<img loading="lazy" alt="" src="${esc(imgUrl(l.cover))}">` : PARCEL}</div>

async function compressImage(file, max = 1600, quality = 0.82) {
  const bmp = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('Fotografija nije čitljiva.')); i.src = URL.createObjectURL(file); });
  const k = Math.min(1, max / Math.max(bmp.naturalWidth, bmp.naturalHeight));
  const c = document.createElement('canvas'); c.width = Math.round(bmp.naturalWidth * k); c.height = Math.round(bmp.naturalHeight * k);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  URL.revokeObjectURL(bmp.src);
  return await new Promise(res => c.toBlob(res, 'image/jpeg', quality)); // nova JPEG datoteka nema EXIF/GPS podatke
}
async function sha256(blob) {
  const buf = await crypto.subtle.digest('SHA-256', await blob.arrayBuffer());
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}
const rnd = () => Math.random().toString(36).slice(2, 10);

const ROUTES = [
  [/^#\/?$/, vHome], [/^#\/pretraga$/, vSearch], [/^#\/oglas\/([\w-]+)$/, vListing], [/^#\/kupi\/([\w-]+)$/, vCheckout],
  [/^#\/objavi$/, vEdit], [/^#\/izmeni\/([\w-]+)$/, vEdit], [/^#\/moji-oglasi$/, vMine], [/^#\/poruke$/, vInbox],
  [/^#\/poruke\/([\w-]+)$/, vChat], [/^#\/porudzbine$/, vOrders], [/^#\/narudzbina\/([\w-]+)$/, vOrder], [/^#\/profil$/, vProfile],
  [/^#\/obavestenja$/, vNotifs], [/^#\/prijava$/, vLogin], [/^#\/saglasnost$/, vConsent], [/^#\/kako-radi$/, vHow],
  [/^#\/uslovi$/, () => vLegal('uslovi')], [/^#\/privatnost$/, () => vLegal('privatnost')]
];
function cleanup() { if (S.channel) { sb.removeChannel(S.channel); S.channel = null; } if (S.timer) { clearInterval(S.timer); S.timer = null; } }
async function router() {
  cleanup();
  const [path, qs] = (location.hash || '#/').split('?');
  const params = new URLSearchParams(qs || '');
  renderNav();
  window.scrollTo(0, 0);
  for (const [re, fn] of ROUTES) {
    const m = path.match(re);
    if (m) { try { await fn(m[1], params); } catch (e) { app.innerHTML = `<div class="empty"><h2>Nešto nije u redu</h2><p>${esc(errMsg(e))}</p><a class="btn" href="#/">Na početnu</a></div>`; } return; }
  }
  app.innerHTML = '<div class="empty"><h2>Stranica ne postoji</h2><a class="btn" href="#/">Na početnu</a></div>';
}

    <div class="note small" id="evn" hidden>Za predmete vrednosti od ${money((cfg.evidence_value_threshold_rsd || 0) * 100)} pre predaje BEX-u biće potrebno ${esc(cfg.evidence_min_photos)} fotografija pakovanja. To štiti i tebe u slučaju reklamacije.</div>

  </div></div></form>`;
  const pending = [];
  const drawUp = () => {
    $('#up').innerHTML = media.map((m, i) => `<div class="u"><img alt="" src="${esc(m.preview || imgUrl(m.path))}">${i === 0 ? '<span class="cov">naslovna</span>' : ''}<button type="button" data-i="${i}" aria-label="Ukloni fotografiju">×</button></div>`).join('');
    $$('#up button').forEach(b => b.onclick = () => { media.splice(+b.dataset.i, 1); drawUp(); });
  };
  drawUp();
  $('#files').onchange = async e => {
    const max = cfg.max_listing_photos || 8;
    for (const f of Array.from(e.target.files)) {
      if (media.length >= max) { toast(`Najviše ${max} fotografija.`, 'warn'); break; }
      try { const blob = await compressImage(f); media.push({ blob, preview: URL.createObjectURL(blob) }); } catch (er) { toast(errMsg(er), 'bad'); }
    }
    e.target.value = ''; drawUp();
  };
  $$('#presets button').forEach(b => b.onclick = () => { const [w, a, c, d] = b.dataset.p.split(','); $('#w').value = w; $('#lc').value = a; $('#wc').value = c; $('#hc').value = d; });
  const evCheck = () => { const val = Number($('#dv').value || $('#p').value || 0); $('#evn').hidden = !(val >= (cfg.evidence_value_threshold_rsd || Infinity)); };
  $('#dv').oninput = evCheck; $('#p').oninput = evCheck; evCheck();
  const save = async publish => {
    const f = $('#lf'); if (!f.reportValidity()) return;
    if (!media.length && publish) { toast('Dodaj bar jednu fotografiju.', 'warn'); return; }
    const d = Object.fromEntries(new FormData(f));
    const payload = { title: d.title, category_id: d.category_id, description: d.description, condition: d.condition, sale_mode: d.sale_mode, price_rsd: Number(d.price_rsd), declared_value_rsd: d.declared_value_rsd ? Number(d.declared_value_rsd) : null, price_negotiable: !!d.price_negotiable, city: d.city, weight_g: Number(d.weight_g), length_cm: Number(d.length_cm), width_cm: Number(d.width_cm), height_cm: Number(d.height_cm), rights_confirmed: !!d.rights_confirmed };
    const r = await rpc('save_listing', { p_id: id || null, p: payload });
    const lid = r.id; id = lid;
    for (const m of media) if (!m.path && m.blob) {
      const path = `${uid()}/${lid}/${Date.now()}-${rnd()}.jpg`;
      const { error } = await sb.storage.from('listing-media').upload(path, m.blob, { contentType: 'image/jpeg', upsert: false });
      if (error) throw new Error('Fotografija nije poslata: ' + errMsg(error));
      m.path = path; delete m.blob;
    }
    await rpc('set_listing_media', { p_listing_id: lid, p_paths: media.map(m => m.path) });
    let st = r.status;
    if (publish && ['DRAFT', 'REJECTED', undefined].includes(l?.status)) { const p = await rpc('publish_listing', { p_id: lid }); st = p.status; }
    if (st === 'ACTIVE') toast('Oglas je objavljen.');
    else if (st === 'PENDING_REVIEW') toast('Oglas je poslat na proveru. Obavestićemo te kada bude objavljen.', 'warn');
    else toast('Sačuvano.');
    go(st === 'ACTIVE' ? '#/oglas/' + lid : '#/moji-oglasi');
  };
  $('#draft').onclick = () => busy($('#draft'), () => save(false));
  $('#pub').onclick = () => busy($('#pub'), () => save(true));
}

          ${live && o.to_user === uid() ? `<div class="row" style="margin-top:10px"><button class="btn buy" data-acc="${esc(o.id)}">Prihvati i potvrdi kupovinu</button><button class="btn" data-rej="${esc(o.id)}">Odbij</button></div>` : ''}
          ${o.order_id ? `<a class="small" href="#/narudzbina/${esc(o.order_id)}">Otvori porudžbinu</a>` : ''}</div>`;
      }

    }).join('') || '<div class="msg sys">Započni razgovor. Pitaj o stanju predmeta, dimenzijama ili rokovima.</div>';

  const act = $('#act'); const parts = [];
  if (isSeller && o.status === 'AWAITING_SHIPMENT' && !ship) {
    const me = S.me;
    parts.push(`<div class="panel"><h3>Predaja BEX-u</h3><ul class="checklist small" style="margin-bottom:12px">
      <li class="${me.pickup?.street ? 'ok' : ''}">Adresa preuzimanja u profilu</li><li class="${me.identity_status === 'VERIFIED' ? 'ok' : ''}">Verifikovan identitet (${esc(L.idn[me.identity_status])})</li>
      <li class="${me.payout?.status === 'VERIFIED' ? 'ok' : ''}">Verifikovan račun za isplatu${me.payout ? ' (' + esc(L.acc[me.payout.status]) + ')' : ''}</li>
      ${o.evidence_required ? `<li class="${ev.length >= minEv ? 'ok' : ''}">Fotografije pakovanja: ${ev.length} od ${minEv}</li>` : ''}</ul>
      ${o.evidence_required ? `<div class="field"><label for="evf">Dokaz pakovanja</label><span class="hint">Snimi predmet, serijski broj ako postoji, ispravnost, zaštitni materijal i zatvoren paket.</span><input id="evf" type="file" accept="image/*,video/*" capture="environment" multiple></div><div class="uploads" style="margin:8px 0" id="evl">${ev.map(() => `<div class="u" style="display:grid;place-items:center">${PARCEL}</div>`).join('')}</div>` : ''}
      <div class="row"><button class="btn primary" id="rdy">Paket je spakovan — prijavi BEX-u</button><button class="btn danger" id="cnl">Otkaži</button></div>
      <p class="small muted" style="margin:8px 0 0">Rok: ${fmtDate(o.handover_deadline, true)}. Ako ne predaš na vreme, porudžbina se otkazuje.</p></div>`);
  }
  if (isBuyer && o.status === 'AWAITING_SHIPMENT' && !ship) parts.push(`<div class="panel"><p class="small">Prodavac priprema paket. Dok ga ne prijavi BEX-u, porudžbinu možeš otkazati.</p><button class="btn danger" id="cnl">Otkaži porudžbinu</button></div>`);
  if (canComplain) parts.push(`<details class="panel"><summary><b>Prijavi problem sa pošiljkom</b></summary><form class="form" id="cpf" style="margin-top:12px">
    <div class="field"><label for="cr">Razlog</label><select id="cr" name="r" required>${(cfg.complaint_reasons || []).map(r => `<option value="${esc(r.code)}">${esc(r.label)}</option>`).join('')}</select></div>

    <button class="btn primary">Pošalji reklamaciju</button></form></details>`);
  act.innerHTML = parts.join('');
  const evf = $('#evf'); if (evf) evf.onchange = async e => {
    for (const f of Array.from(e.target.files)) {
      try {
        const isImg = f.type.startsWith('image/');
        const blob = isImg ? await compressImage(f, 2000, 0.85) : f;
        const ext = isImg ? 'jpg' : (f.name.split('.').pop() || 'mp4').toLowerCase().replace(/[^a-z0-9]/g, '');
        const path = `${uid()}/${id}/${Date.now()}-${rnd()}.${ext}`;

        if (error) throw new Error(errMsg(error));
        await rpc('add_packing_evidence', { p_order_id: id, p_path: path, p_sha256: await sha256(blob), p_mime: mime, p_size: blob.size });

    }

  };
  const rdy = $('#rdy'); if (rdy) rdy.onclick = () => busy(rdy, async () => { const r = await rpc('mark_ready_for_pickup', { p_order_id: id }); toast('Pošiljka je prijavljena BEX-u: ' + (r.tracking_no || '')); vOrder(id); });
  const cnl = $('#cnl'); if (cnl) cnl.onclick = () => busy(cnl, async () => { const r = prompt('Razlog otkazivanja:'); if (r === null) return; await rpc('cancel_order', { p_order_id: id, p_reason: r }); toast('Porudžbina je otkazana.'); vOrder(id); });
  const cpf = $('#cpf'); if (cpf) cpf.onsubmit = e => { e.preventDefault(); busy(cpf.querySelector('button'), async () => { await rpc('open_complaint', { p_order_id: id, p_reason: cpf.r.value, p_description: cpf.d.value }); toast('Reklamacija je zaprimljena.'); vOrder(id); }); };
}

async function vLogin(_, p) {
  const next = p.get('next') || '#/';

  app.innerHTML = `<div style="max-width:440px;margin:0 auto"><h1 style="font-size:30px">Prijava</h1><div class="chips" style="margin-bottom:14px"><button class="chip on" data-t="in">Imam nalog</button><button class="chip" data-t="up">Novi nalog</button></div>

  <form class="panel form" id="lup" hidden><div class="field"><label for="un">Prikazano ime</label><input id="un" name="display_name" type="text" minlength="2" maxlength="40" required></div>

    <div class="field"><label for="up2">Lozinka (najmanje 8 znakova)</label><input id="up2" name="password" type="password" minlength="8" required autocomplete="new-password"></div>
    ${consentFields()}<button class="btn buy">Napravi nalog</button></form></div>`;
  $$('[data-t]').forEach(b => b.onclick = () => { $$('[data-t]').forEach(x => x.classList.toggle('on', x === b)); $('#lin').hidden = b.dataset.t !== 'in'; $('#lup').hidden = b.dataset.t !== 'up'; });
  $('#lin').onsubmit = e => { e.preventDefault(); busy(e.target.querySelector('button'), async () => {
    const v = Object.fromEntries(new FormData(e.target));
    const { data, error } = await sb.auth.signInWithPassword({ email: v.email, password: v.password }); if (error) throw error;
    S.session = data.session; await loadMe(); go(S.me && !S.me.terms_ok ? '#/saglasnost?next=' + encodeURIComponent(next) : next);
  }); };
  $('#lup').onsubmit = e => { e.preventDefault(); busy(e.target.querySelector('button'), async () => {
    const v = Object.fromEntries(new FormData(e.target));
    const { data, error } = await sb.auth.signUp({ email: v.email, password: v.password, options: { data: { display_name: v.display_name } } }); if (error) throw error;
    if (!data.session) { app.innerHTML = '<div class="empty panel"><h2>Proveri e-poštu</h2><p>Poslali smo link za potvrdu naloga. Posle potvrde se prijavi.</p></div>'; return; }
    S.session = data.session; await acceptTerms(v); await loadMe(); toast('Nalog je napravljen. Sledeći korak: potvrdi telefon.'); go('#/profil');
  }); };
}

  app.innerHTML = `<div style="max-width:70ch"><div class="note hold"><b>NACRT — nije pravno odobren.</b> Konačan tekst priprema pravna služba pre javnog puštanja (Registar odluka, stavka P-01).</div>
  ${kind === 'uslovi' ? `<h1 style="font-size:30px">Uslovi korišćenja</h1><p>eBex je platforma za oglašavanje i prodaju robe između fizičkih lica u Republici Srbiji. Oglasi fizičkih lica su besplatni.</p><p>Kupovina se plaća isključivo pouzećem BEX kuriru pri uručenju. Dostava se obavlja isključivo preko BEX-a; lično preuzimanje nije dozvoljeno.</p><p>Komunikacija između korisnika odvija se samo kroz eBex poruke. Razmena kontakt podataka radi dogovora van platforme je zabranjena i može dovesti do ograničenja naloga.</p><p>BEX isplaćuje prodavcu naplaćeni iznos na verifikovani račun koji glasi na prodavca, po pravilu narednog radnog dana. Prijava reklamacije ili sumnje na prevaru pre isplate zaustavlja isplatu do odluke eBex-a, uz mogućnost žalbe.</p><p>Zabranjena je prodaja robe sa liste zabranjenih proizvoda. U prvoj fazi nije dozvoljena prodaja automobila i nekretnina.</p>`
  : `<h1 style="font-size:30px">Politika privatnosti</h1><p>Obrađujemo podatke potrebne za nalog, bezbednost, dostavu i isplatu: e-adresu, broj telefona, ime i prezime, adrese za dostavu i preuzimanje i račun za isplatu.</p><p>Broj telefona i adrese se ne prikazuju drugim korisnicima. Adresu primaoca i telefon dobija BEX radi dostave.</p><p>Fotografije oglasa se pre slanja smanjuju i iz njih se uklanjaju skriveni podaci o lokaciji. Dokazi o pakovanju dostupni su samo ovlašćenim licima u postupku reklamacije.</p><p>Možeš zatražiti izvoz, ispravku ili brisanje podataka iz profila. Podatke koje zakon nalaže čuvamo u propisanom roku.</p>`}</div>`;
}

/* =================== pokretanje =================== */
function notConfigured() {
  app.innerHTML = `<div class="panel" style="max-width:640px;margin:40px auto"><h1 style="font-size:28px">Aplikacija još nije povezana sa bazom</h1>
  <p>Otvori fajl <b>config.js</b> u GitHub-u (olovka za izmenu) i upiši <b>Project URL</b> i <b>Publishable key</b> iz Supabase-a. Detalji su u uputstvu, korak 4.</p>
  <p class="small muted">Trenutna vrednost adrese: ${esc(CONF.SUPABASE_URL || 'nije upisana')}</p></div>`;
}
async function boot() {
  $('#topSearch').onsubmit = e => { e.preventDefault(); go('#/pretraga?q=' + encodeURIComponent(e.target.q.value.trim())); };
  if (!CONFIGURED || !sb) { renderNav(); notConfigured(); return; }
  try {
    const [cfgRows, cats, sess] = await Promise.all([
      q(sb.from('app_config').select('key, value')), q(sb.from('categories').select('*').order('sort')), sb.auth.getSession()
    ]);
    cfgRows.forEach(r => { S.cfg[r.key] = r.value; });
    S.cats = cats; S.session = sess.data.session;
  } catch (e) {
    app.innerHTML = `<div class="panel" style="max-width:640px;margin:40px auto"><h1 style="font-size:26px">Baza nije spremna</h1><p>${esc(errMsg(e))}</p><p class="small muted">Proveri da li je SQL skripta pokrenuta u Supabase SQL Editoru (uputstvo, korak 3) i da su ključevi u config.js tačni.</p></div>`;
    return;
  }
  $('#sbx').hidden = !S.cfg.sandbox_mode;
  await loadMe();
  sb.auth.onAuthStateChange((ev, session) => {
    const changed = (session?.user?.id || null) !== uid();
    S.session = session;
    // Supabase preporučuje da se drugi pozivi ne čekaju unutar ovog povratnog poziva
    if (changed) setTimeout(async () => { await loadMe(); renderNav(); if (ev === 'SIGNED_OUT') go('#/'); }, 0);
  });
  window.addEventListener('hashchange', async () => { if (S.session) { await loadMe(); } router(); });
  router();
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('./sw.js').catch(() => {});
}
boot();
</script>
